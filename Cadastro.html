<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tech Acessórios</h1>
        <nav>
            <a href="index.html">Início</a>
        </nav>
    </header>
    <main>
        <h2>Página de Cadastro</h2>
        <p>Preencha seus dados para cadastrar</p>

        <form>
            <label>Nome completo:</label>
            <input type="text" name="nome">
            <label>E-mail:</label>
            <input type="email" name="email">
            <label>Senha:</label>
            <input type="password" name="senha">
            <label>Data de nascimento:</label>
            <input type="date" name="data">
            <label>Preferencia de produto:</label>
            <select name="preferencia">
                <option value="mouse">Mouse</option>
                <option value="teclado">Teclado Mecânico</option>
                <option value="periferico">Periférico Gamer</option>
            </select>
            <button type="submit">Enviar</button>
        </form>

        <a href="index.html">Voltar para a página principal</a>
    </main>

    <footer>
        <p>Tech Acessórios 2026</p>
    </footer>
</body>
</html>
